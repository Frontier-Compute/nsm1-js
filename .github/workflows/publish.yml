name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      preflight: ${{ steps.preflight.outputs.payload }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit signatures
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:packed
        env:
          ZAP1_PACK_RESULT: ${{ runner.temp }}/zap1-preflight.json
      - run: git diff --exit-code -- dist
      - id: preflight
        shell: bash
        run: echo "payload=$(base64 -w0 "$RUNNER_TEMP/zap1-preflight.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.publish.outputs.payload }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Decode verified preflight
        shell: bash
        run: printf '%s' '${{ needs.verify.outputs.preflight }}' | base64 -d > "$RUNNER_TEMP/zap1-preflight.json"
      - name: Verify exact tagged checkout
        shell: bash
        run: INIT_CWD="$PWD" node scripts/check-release.mjs
      - name: Pack exact checkout without lifecycle scripts
        shell: bash
        run: npm pack --ignore-scripts --json > "$RUNNER_TEMP/zap1-publish.pack.json"
      - name: Match preflight artifact before publication
        shell: bash
        run: node scripts/verify-prepublish.mjs "$RUNNER_TEMP/zap1-preflight.json" "$RUNNER_TEMP/zap1-publish.pack.json"
      - name: Publish verified checkout without lifecycle scripts
        shell: bash
        run: npm publish --ignore-scripts --access public --provenance --json > "$RUNNER_TEMP/zap1-publish.raw.json"
      - name: Export publication result
        id: publish
        shell: bash
        run: echo "payload=$(base64 -w0 "$RUNNER_TEMP/zap1-publish.raw.json")" >> "$GITHUB_OUTPUT"

  verify-registry:
    needs: [verify, publish]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify registry source and artifact provenance
        shell: bash
        run: printf '%s' '${{ needs.verify.outputs.preflight }}' | base64 -d > "$RUNNER_TEMP/zap1-preflight.json"
      - shell: bash
        run: printf '%s' '${{ needs.publish.outputs.result }}' | base64 -d > "$RUNNER_TEMP/zap1-publish.raw.json"
      - shell: bash
        run: node scripts/verify-published.mjs "$RUNNER_TEMP/zap1-preflight.json" "$RUNNER_TEMP/zap1-publish.raw.json"
